<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE Study Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap">
<style>
:root{--bg:#eef1f9;--card:#fff;--ink:#162033;--mute:#66728a;--line:#e3e8f3;--track:#e3e8f3;--p:#4f63f5;--c:#0fa37f;--m:#f2762e;--hero1:#1b2559;--hero2:#3b2a8c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c111f;--card:#151c2f;--ink:#e9eefb;--mute:#8e9ab5;--line:#242d47;--track:#242d47;--p:#7b8cff;--c:#2ccfa8;--m:#ff9a5c}}
:root[data-theme="dark"]{--bg:#0c111f;--card:#151c2f;--ink:#e9eefb;--mute:#8e9ab5;--line:#242d47;--track:#242d47;--p:#7b8cff;--c:#2ccfa8;--m:#ff9a5c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 420px at 5% -10%,color-mix(in srgb,var(--p) 16%,transparent),transparent),radial-gradient(700px 380px at 100% 0,color-mix(in srgb,var(--m) 13%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.4 "DM Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 40px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:22px;padding:20px;box-shadow:0 14px 32px -14px rgba(40,50,140,.6)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font:400 26px/1.1 "DM Serif Display",Georgia,serif}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.big{font:400 52px/1 "DM Serif Display",Georgia,serif;letter-spacing:-1px}
.big small{font-size:24px}
.bar{height:12px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--ink);transition:width .35s ease}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tab{font:inherit;color:inherit;text-align:left;background:linear-gradient(180deg,color-mix(in srgb,var(--col) 13%,var(--card)),var(--card) 75%);border:1.5px solid var(--line);border-top:4px solid var(--col);border-radius:16px;padding:12px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{border-color:var(--col);box-shadow:0 10px 24px -10px var(--col)}
.tab b{display:block;font-size:14px}
.tab span{font:400 26px/1.2 "DM Serif Display",Georgia,serif;color:var(--col)}
.tab .bar{height:6px;margin-top:6px}.tab .bar i{background:var(--col)}
.tab em{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 14px 34px -20px rgba(30,40,110,.4)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--col) 16%,var(--card)),var(--card))}
.ph h2{margin:0;font:400 22px "DM Serif Display",Georgia,serif;color:var(--col)}
.btn{font:inherit;font-size:13px;color:var(--ink);background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:600px}
th,td{padding:0 4px;text-align:center;height:46px;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:11.5px;line-height:1.15;color:var(--col);height:46px;position:sticky;top:0;background:color-mix(in srgb,var(--col) 8%,var(--card));white-space:normal}
th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding-left:16px;min-width:170px;max-width:210px;font-weight:500}
td:first-child{box-shadow:1px 0 0 var(--line)}
tr:last-child td{border-bottom:0}
tr.done td:first-child{color:var(--col)}
label.cb{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;cursor:pointer}
.cb input{position:absolute;opacity:0;width:1px;height:1px}
.cb span{width:22px;height:22px;border-radius:7px;border:2px solid var(--mute);display:grid;place-items:center;transition:background .15s,border-color .15s}
.cb span::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .12s}
.cb input:checked+span{background:var(--col);border-color:var(--col)}
.cb input:checked+span::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
.cb input:focus-visible+span{outline:3px solid var(--col);outline-offset:2px}
.pct{font:inherit;font-size:13px;font-weight:700;color:var(--mute);background:none;border:0;cursor:pointer;width:64px;height:44px}
.pct:hover{color:var(--col)}
.nm{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mv{display:flex;flex-direction:column;flex:none}
.mv button{font-size:9px;line-height:1;width:26px;height:22px;border:0;background:none;color:var(--mute);cursor:pointer;border-radius:6px}
.mv button:hover{background:var(--bg);color:var(--col)}
.tx{font:inherit;font-size:13px;width:200px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tx:focus{outline:2px solid var(--col);border-color:transparent}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero>*{position:relative;z-index:1}
.hero .sub{color:rgba(255,255,255,.75)}
.hero .bar{height:14px;background:rgba(255,255,255,.18)}
.hero .bar i{background:linear-gradient(90deg,#8d9bff,#3fe0b8,#ffb066)}
.ic{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--col);color:#fff;margin-right:7px;font-size:14px;vertical-align:-3px}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--col) 3.5%,var(--card))}
tbody tr:hover td{background:color-mix(in srgb,var(--col) 8%,var(--card))}
tbody tr.done td{background:color-mix(in srgb,var(--col) 13%,var(--card))}
.done .nm span:first-child::before{content:"✓ ";font-weight:700}
tr.done .pct{color:var(--col)}
.foot{color:var(--mute);font-size:12px;margin-top:12px;text-align:center}
@media (max-width:480px){.big{font-size:42px}h1{font-size:22px}.tab span{font-size:22px}.tab{padding:10px}.tab em{font-size:11px}.ic{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="top">
      <div><h1>JEE study tracker</h1><div class="sub" id="oSub"></div></div>
      <div class="big"><span id="oPct">0</span><small>%</small></div>
    </div>
    <div class="bar" role="progressbar" aria-label="Overall preparation"><i id="oBar"></i></div>
  </section>
  <div class="tabs" id="tabs" role="tablist"></div>
  <section class="panel" id="panel">
    <div class="ph"><h2 id="pName"></h2><div style="display:flex;gap:8px;align-items:center"><span class="sub" id="pSub"></span><button class="btn" id="reset">Reset all</button></div></div>
    <div class="scroll"><table id="tbl"></table></div>
  </section>
  <div class="foot">Tap a chapter’s percentage to tick or clear its whole row. Progress saves on this device.</div>
</div>
<script>
var BASE=["Lectures","Notes","Mains PYQs","Adv PYQs","Module","Batch sheets","Tests","Revision"],BS=["Lec","Notes","Mains PYQ","Adv PYQ","Module","Sheets","Tests","Rev"];
var EX=[[["KPPs","SBM","Irodov","SBT Level-1"],["KPP","SBM","Irodov","SBT L1"]],[["Extra book"],["Extra book"]],[["TK sir assignment","SBM"],["TK sir","SBM"]]];
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
var DATA=[
{n:"Physics",c:"var(--p)",ch:["Kinematics","NLM & Friction","WPE & Circular Motion","Centre of Mass","Rotational Motion","Atomic Physics","Dual Nature","Nuclear Physics","KTG","Thermal Properties of Matter","Thermodynamics","Fluids","Properties of Matter","SHM","Electrostatics","Gravitation","Capacitance","Current Electricity","Magnetic Effect of Current","Magnetic Effects of Matter","Alternating Current","EMI","Wave Optics","Geometrical Optics","Strings & Sound","Semiconductor"]},
{n:"Chemistry",c:"var(--c)",ch:["Mole Concept","Atomic Structure","Liquid Solution","Electrochemistry","Chemical Kinetics","Chemical Equilibrium","Ionic Equilibrium","Redox & Equivalent Concept","Thermodynamics","Periodic Table","Chemical Bonding","GOC","Isomerism","Hydrocarbon","Alkyl Halide","Alcohol, Phenol, Ethers","Aldehyde & Ketone","Carboxylic Acid & its Derivatives","Amines","Biomolecules","Coordination","d & f-Block","p-Block","Salt Analysis"]},
{n:"Maths",c:"var(--m)",ch:["Quadratic Equations","Sequence & Series","Trigonometric Functions","Trigonometric Equations","Permutation & Combination","Binomial Theorem","Straight Lines","Circle","Parabola","Ellipse","Hyperbola","Matrices","Determinants","Basic Maths & Sets","Function","ITF","Limits","Continuity & Differentiability","Application of Derivatives","Indefinite Integration","Definite Integration","Area Under Curve","Differential Equations","Vector","3D","Complex Numbers","Probability","Statistics"]}
];
var KEY="jee-tracker-v1",state={},active=0,N,PARAMS,SHORT;
DATA.forEach(function(s,i){s.P=BASE.concat(EX[i][0]);s.S=BS.concat(EX[i][1]);s.i=["⚛","⚗","∑"][i]});
function setSub(){var s=DATA[active];PARAMS=s.P;SHORT=s.S;N=PARAMS.length}
setSub();
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){state={}}
if(!state.m2){var ns={};for(var q in state){var mm=/^(\d):(\d+):(\d+)$/.exec(q);if(mm&&+mm[3]>=3)ns[mm[1]+":"+mm[2]+":"+(+mm[3]+1)]=1;else ns[q]=state[q]}ns.m2=1;state=ns;save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function k(s,c,p){return s+":"+c+":"+p}
function order(s){var o=state.order&&state.order[s],n=DATA[s].ch.length;if(!o||o.length!==n){o=[];for(var i=0;i<n;i++)o.push(i)}return o}
function bump(c){var o=order(active);if(o[0]===c)return;o=o.filter(function(x){return x!==c});o.unshift(c);state.order=state.order||{};state.order[active]=o;save();var tb=$("tbl").tBodies[0],r=tb.querySelector('tr[data-c="'+c+'"]');tb.insertBefore(r,tb.firstChild);$("panel").scrollIntoView({behavior:"smooth",block:"start"})}
function move(c,d){var o=order(active),i=o.indexOf(c),j=i+d;if(j<0||j>=o.length)return;o[i]=o[j];o[j]=c;state.order=state.order||{};state.order[active]=o;save();var tb=$("tbl").tBodies[0],r=tb.querySelector('tr[data-c="'+c+'"]'),h=r.offsetHeight;if(d<0)tb.insertBefore(r,r.previousElementSibling);else tb.insertBefore(r.nextElementSibling,r);window.scrollBy(0,d*h)}
function subCh(s){var n=DATA[s].P.length,r=0;DATA[s].ch.forEach(function(_,c){for(var p=0;p<n;p++)if(!state[k(s,c,p)])return;r++});return r}
function subDone(s){var d=0,n=DATA[s].P.length;DATA[s].ch.forEach(function(_,c){for(var p=0;p<n;p++)if(state[k(s,c,p)])d++});return d}
function pct(d,t){return (t?d/t*100:0).toFixed(1)}
function $(id){return document.getElementById(id)}
function renderTabs(){
  $("tabs").innerHTML=DATA.map(function(s,i){return '<button class="tab" role="tab" data-i="'+i+'" style="--col:'+s.c+'" aria-selected="'+(i===active)+'"><b><i class="ic">'+s.i+'</i>'+s.n+'</b><span id="tp'+i+'">0%</span><div class="bar"><i id="tb'+i+'"></i></div><em id="te'+i+'"></em></button>'}).join("");
}
function renderTable(){
  var s=DATA[active];
  $("panel").style.setProperty("--col",s.c);$("pName").textContent=s.n;
  var h='<thead><tr><th>Chapter</th>'+SHORT.map(function(x,i){return '<th title="'+PARAMS[i]+'">'+x+'</th>'}).join("")+(active===1?'<th>Books / exercises solved</th>':'')+'<th>Done</th></tr></thead><tbody>';
  order(active).forEach(function(c){var name=s.ch[c];
    h+='<tr data-c="'+c+'"><td><div class="nm"><span>'+name.replace(/&/g,"&amp;")+'</span><span class="mv"><button data-d="-1" aria-label="Move up">▲</button><button data-d="1" aria-label="Move down">▼</button></span></div></td>';
    for(var p=0;p<N;p++)h+='<td><label class="cb"><input type="checkbox" data-c="'+c+'" data-p="'+p+'" aria-label="'+name.replace(/&/g,"and")+' – '+PARAMS[p]+'"'+(state[k(active,c,p)]?' checked':'')+'><span></span></label></td>';
    if(active===1)h+='<td><input type="text" class="tx" data-t="'+c+'" maxlength="200" placeholder="e.g. MS Chouhan Ex-1" aria-label="Books solved for '+name.replace(/&/g,"and")+'" value="'+esc(state["x:"+active+":"+c]||"")+'"></td>';
    h+='<td><button class="pct" data-row="'+c+'" title="Toggle whole row">0%</button></td></tr>';
  });
  $("tbl").innerHTML=h+'</tbody>';
  $("tbl").style.minWidth=(240+N*44+(active===1?210:0))+"px";
}
function update(){
  var tot=0,done=0,chD=0;
  DATA.forEach(function(s,i){
    var t=s.ch.length*s.P.length,d=subDone(i);tot+=t;done+=d;chD+=subCh(i);
    $("tp"+i).textContent=pct(d,t)+"%";$("tb"+i).style.width=pct(d,t)+"%";
    $("te"+i).textContent=subCh(i)+"/"+s.ch.length+" chapters";
  });
  var o=pct(done,tot);
  $("oPct").textContent=o;$("oBar").style.width=o+"%";
  $("oSub").textContent=chD+" of "+DATA.reduce(function(a,s){return a+s.ch.length},0)+" chapters completed";
  var sd=subDone(active),st=DATA[active].ch.length*N;
  $("pSub").textContent=pct(sd,st)+"% · "+subCh(active)+"/"+DATA[active].ch.length+" chapters done";
  DATA[active].ch.forEach(function(_,c){
    var d=0;for(var p=0;p<N;p++)if(state[k(active,c,p)])d++;
    var row=document.querySelector('tr[data-c="'+c+'"]');
    row.className=d===N?"done":"";
    row.querySelector(".pct").textContent=pct(d,N)+"%";
  });
}
$("tabs").addEventListener("click",function(e){
  var b=e.target.closest(".tab");if(!b)return;
  active=+b.dataset.i;setSub();renderTabs();renderTable();update();
});
$("tbl").addEventListener("change",function(e){
  var t=e.target;if(!t.dataset.p)return;
  var key=k(active,t.dataset.c,t.dataset.p);
  if(t.checked){state[key]=1;bump(+t.dataset.c)}else delete state[key];
  save();update();
});
$("tbl").addEventListener("click",function(e){
  var m=e.target.closest(".mv button");if(m){move(+m.closest("tr").dataset.c,+m.dataset.d);return}
  var b=e.target.closest(".pct");if(!b)return;
  var c=+b.dataset.row,all=true,p;
  for(p=0;p<N;p++)if(!state[k(active,c,p)])all=false;
  for(p=0;p<N;p++){if(all)delete state[k(active,c,p)];else state[k(active,c,p)]=1}
  save();
  var boxes=b.closest("tr").querySelectorAll("input");
  for(p=0;p<N;p++)boxes[p].checked=!all;if(!all)bump(c);
  update();
});
$("tbl").addEventListener("input",function(e){
  var t=e.target;if(!t.dataset.t)return;
  var key="x:"+active+":"+t.dataset.t;
  if(t.value.trim())state[key]=t.value;else delete state[key];
  save();
});
$("reset").addEventListener("click",function(){
  if(!confirm("Clear every tick in all three subjects?"))return;
  state={};save();renderTable();update();
});
renderTabs();renderTable();update();
</script>
</body>
</html>
